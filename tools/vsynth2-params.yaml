# SPDX-License-Identifier: GPL-3.0-only
# M-Vsynth2 parameter overlay, keyed by Synth1 parameter index (= .sy1 line index = Synth2 ParamId).
# Ranges, defaults and the INIT patch come from Synth2 (EngineCore/Params.hpp, InitPatch.hpp: MIT, F. Chabloz);
# this file adds what the panel needs. tools/gen_params.py merges the two into firmware/gen/vs_params.h.
#
#   key    C name suffix (VS_P_<KEY>)        label  panel label, <= 7 characters (240 px / 4 knobs)
#   sec    panel section                     kind   num / signed (shown value - centre) / switch / enum / table
#   cc     the panel's MIDI CC (decision 9; none: the routing words and POLY)
#
# pages: the panel in its order: the button, the title, the four knobs' parameters (~ an empty column). Every
#   parameter is on one page exactly, but 59 (ARP on / off: the ARP button's tap). gen_params.py checks it.
# fx_knobs: what CTRL 1, CTRL 2 and LEVEL are called in each EFFECT type (Synth2's DisplayName, as panel labels).
